name: Build StikDebug IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'


    - name: Show Xcode
      run: |
        xcodebuild -version
        xcode-select -p


    - name: Resolve packages
      run: |
        xcodebuild \
        -resolvePackageDependencies \
        -project StikDebug.xcodeproj


    - name: Build Archive
      run: |
        xcodebuild clean archive \
        -project StikDebug.xcodeproj \
        -scheme StikDebug \
        -configuration Debug \
        -archivePath build/StikDebug.xcarchive \
        -sdk iphoneos \
        -destination "generic/platform=iOS" \
        ONLY_ACTIVE_ARCH=NO \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO


    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/
        zip -r StikDebug.ipa Payload


    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StikDebug-IPA
        path: StikDebug.ipa
