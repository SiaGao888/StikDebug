name: Build StikDebug IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app

    - name: Resolve packages
      run: |
        xcodebuild -resolvePackageDependencies \
        -project StikDebug.xcodeproj

    - name: Build Archive
      run: |
        xcodebuild archive \
        -project StikDebug.xcodeproj \
        -scheme StikDebug \
        -archivePath build/StikDebug.xcarchive \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO

    - name: Create IPA
      run: |
        mkdir Payload
        cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/

        zip -r StikDebug.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StikDebug-IPA
        path: StikDebug.ipa
