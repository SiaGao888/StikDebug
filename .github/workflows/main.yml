name: Build StikDebug IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Find and Select Xcode
      run: |
        echo "Available Xcode:"
        ls /Applications | grep Xcode

        XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -1)

        if [ -z "$XCODE_PATH" ]; then
          echo "Xcode 16 not found, using default Xcode"
          XCODE_PATH="/Applications/Xcode.app"
        fi

        echo "Using: $XCODE_PATH"

        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

        xcodebuild -version


    - name: Resolve packages
      run: |
        xcodebuild \
        -resolvePackageDependencies \
        -project StikDebug.xcodeproj


    - name: Build Archive
      run: |
        xcodebuild clean archive \
        -project StikDebug.xcodeproj \
        -scheme StikDebug \
        -configuration Debug \
        -archivePath build/StikDebug.xcarchive \
        -destination "generic/platform=iOS" \
        ONLY_ACTIVE_ARCH=NO \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO \
        SWIFT_OPTIMIZATION_LEVEL=-Onone


    - name: Create IPA
      run: |
        mkdir -p Payload

        cp -R \
        build/StikDebug.xcarchive/Products/Applications/StikDebug.app \
        Payload/

        zip -r StikDebug.ipa Payload


    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: StikDebug-IPA
        path: StikDebug.ipa
